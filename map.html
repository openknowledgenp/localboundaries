---
layout: default
title: Map
permalink: /map/
full_bleed: true
---

<div class="map-page">
  <aside class="map-sidebar">
    <h2>Select Layers</h2>
    <div class="layer-group">
      <p class="layer-group-title">Boundary</p>
      <label><input type="checkbox" id="layer-local-level" checked> Local Levels</label>
      <label><input type="checkbox" id="layer-district" checked> Districts</label>
      <label><input type="checkbox" id="layer-province" checked> Provinces</label>
    </div>
    <p class="map-sidebar-note">
      Click any boundary for details.
      <a href="{{ "/download/" | prepend: site.baseurl }}">Download this data &rarr;</a>
    </p>
  </aside>
  <div id="map"></div>
</div>

<script>
  var map = L.map('map', { zoomControl: false }).setView([28.1999999, 84.100140], 7);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18, minZoom: 6, subdomains: 'abcd',
    attribution: 'Map data &copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors, ' +
      '<a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>, ' +
      'Tiles by <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);

  var localLevel = L.geoJson(null, {
    style: function () {
      return { fillColor: '#D5E3FF', fillOpacity: 1, color: '#555', weight: 1, opacity: 0.5 };
    },
    onEachFeature: bindLocalLevel
  }).addTo(map);

  var district = L.geoJson(null, {
    style: { weight: 2, color: '#222', fillColor: 'none' },
    onEachFeature: bindDistrict
  }).addTo(map);

  var province = L.geoJson(null, {
    style: { weight: 2.5, color: '#e63946', fillColor: 'none' },
    onEachFeature: bindProvince
  }).addTo(map);

  function loadBoundary(url, layer, objectName) {
    fetch(url)
      .then(function (response) { return response.json(); })
      .then(function (data) {
        layer.addData(topojson.feature(data, data.objects[objectName]));
      })
      .catch(function (err) { console.error('Failed to load ' + url, err); });
  }

  var dataBase = "{{ "/data" | prepend: site.baseurl }}";
  loadBoundary(dataBase + '/local-level/nepal.topojson', localLevel, 'local_levels');
  loadBoundary(dataBase + '/district/nepal.topojson', district, 'districts');
  loadBoundary(dataBase + '/province/nepal.topojson', province, 'provinces');

  function bindLocalLevel(feature, layer) {
    var p = feature.properties;
    layer.bindTooltip(p.GaPa_NaPa + ' (' + p.Type_GN + ')', { sticky: true });
    layer.bindPopup('<strong>' + p.GaPa_NaPa + '</strong><br>' + p.Type_GN + ', ' + p.DISTRICT + ' District');
    layer.on({ mouseover: enterLayer, mouseout: leaveLayer });
  }

  function bindDistrict(feature, layer) {
    var p = feature.properties;
    layer.bindTooltip(p.DISTRICT, { sticky: true });
    layer.bindPopup('<strong>' + p.DISTRICT + ' District</strong><br>' + p.PR_NAME);
  }

  function bindProvince(feature, layer) {
    var p = feature.properties;
    layer.bindTooltip(p.PR_NAME, { sticky: true });
    layer.bindPopup('<strong>' + p.PR_NAME + '</strong>');
  }

  function enterLayer(e) {
    e.target.bringToFront();
    e.target.setStyle({ weight: 2, opacity: 1 });
  }

  function leaveLayer(e) {
    e.target.bringToBack();
    e.target.setStyle({ weight: 1, opacity: 0.5 });
  }

  function wireToggle(id, layer) {
    document.getElementById(id).addEventListener('change', function (e) {
      map[e.target.checked ? 'addLayer' : 'removeLayer'](layer);
    });
  }
  wireToggle('layer-local-level', localLevel);
  wireToggle('layer-district', district);
  wireToggle('layer-province', province);
</script>
